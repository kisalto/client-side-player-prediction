# docker-compose.yml
# ---------------------------------------------------------------------------
# Sobe Postgres + TelemetryService juntos. Uso (a partir de app/, nao da
# raiz do repo):
#   cd app && docker compose up --build
# O jogo (tmwa-map) manda telemetria via UDP pra bridge (telemetry/bridge/,
# roda separado, tipicamente na mesma maquina/regiao do tmwa-map), que
# reenvia pra localhost:50051 (esse TelemetryService).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Host 5433 (nao 5432): a maquina de dev tem um PostgreSQL nativo do
    # Windows (servico postgresql-x64-18) ocupando a 5432, e com o WSL em
    # networkingMode=mirrored as portas sao compartilhadas -- o Docker nao
    # conseguia publicar a 5432 e localhost:5432 caia no Postgres errado.
    # Dentro da rede do compose o Postgres continua na 5432 (ver
    # TELEMETRY_DSN abaixo). Detalhes: README.md, secao "Portas".
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./telemetry/service/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  telemetry-service:
    build:
      context: .
      dockerfile: telemetry/service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TELEMETRY_DSN: "dbname=telemetry user=postgres password=postgres host=postgres"
    ports:
      - "50051:50051"

volumes:
  pgdata:
