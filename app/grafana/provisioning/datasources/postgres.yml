apiVersion: 1
datasources:
  - name: TCC Postgres
    uid: tcc-postgres
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: postgres
    secureJsonData:
      password: postgres
    jsonData:
      database: telemetry
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
