// telemetry.proto
// ---------------------------------------------------------------------------
// Contrato gRPC entre a bridge (telemetry/bridge/) e o TelemetryService.
//
// HISTORICO: a primeira versao deste arquivo espelhava o projeto Unity
// (TelemetrySnapshot com is_grounded/is_dashing/boss_active/enemies/bullets
// etc.) -- abandonado quando pivotamos pro tmwa. Esta versao reflete o que
// telemetry.cpp (no fork do tmwa) realmente manda: um evento flat por
// jogador (posicao, vida, se morreu), sem estado de boss/inimigos/projeteis
// (o tmwa e uma arquitetura MMO tick-based classica, nao um jogo de acao
// com esse tipo de estado por frame).
//
// Qualquer campo novo que adicionar aqui: SEMPRE um numero novo, nunca
// reaproveite/renumere um campo antigo (quebra compatibilidade com dados ja
// gravados).
//
// DECISOES DE DESIGN
// - Um tmwa-map serve MUITOS jogadores ao mesmo tempo -- nao existe "uma
//   sessao por jogador" como nos projetos anteriores (Unity/toho-like-js).
//   Aqui, "sessao" = uma execucao continua da bridge (que por sua vez
//   recebe eventos de TODOS os jogadores conectados ao tmwa-map naquele
//   periodo). char_id, dentro de cada evento, distingue de qual jogador
//   veio cada linha.
// - tmwa nao manda timestamp (o UDP so tem os campos que pc.cpp conhece).
//   bridge_recv_time e preenchido pela BRIDGE no momento em que recebe o
//   datagrama -- e o timestamp "de verdade" usado no resto do pipeline.
// - Stream bidirecional: a bridge manda session_start uma vez, depois
//   TelemetryBatch conforme acumula eventos recebidos por UDP. O servidor
//   confirma cada batch com um BatchAck (mesma razao de antes: metrica de
//   round-trip de graca, util na Fase 9).
// - SendBatch (unario) continua existindo para reenviar dados fora de uma
//   sessao ao vivo (scripts de teste, replay etc.).

syntax = "proto3";

package telemetry;

// ---------------------------------------------------------------------------
// Evento de jogador (espelha o JSON de telemetry.cpp::player_to_json)
// ---------------------------------------------------------------------------

message PlayerEvent {
  string event_type = 1;   // "snapshot" (periodico) | "player_hurt" | "player_death" |
                             // "player_move_cmd" | "player_attack"
  uint32 char_id = 2;      // sd->status_key.char_id._value
  int32 x = 3;             // posicao ATUAL (sd->bl_x) -- presente em TODOS os event_type
  int32 y = 4;             // posicao ATUAL (sd->bl_y) -- presente em TODOS os event_type
  int32 hp = 5;            // sd->status.hp
  int32 max_hp = 6;        // sd->status.max_hp
  bool dead = 7;           // pc_isdead(sd)
  int32 extra = 8;         // quantidade de dano em player_hurt/player_death; 0 nos demais
  double bridge_recv_time = 9;  // epoch seconds, preenchido pela bridge (nao vem do tmwa)

  // campos especificos de acao -- so preenchidos no event_type correspondente,
  // valores-sentinela (-1 ou false/0) nos demais (ver telemetry.cpp)
  int32 dest_x = 10;       // so em player_move_cmd: destino comandado (pc_walktoxy)
  int32 dest_y = 11;       // so em player_move_cmd
  int32 target_id = 12;    // so em player_attack: sd->attacktarget / BlockId do alvo
  bool continuous = 13;    // so em player_attack: ataque continuo (segurar) vs. unico clique
}

// ---------------------------------------------------------------------------
// Envelope de sessao e transporte
// ---------------------------------------------------------------------------

message SessionInfo {
  string session_id = 1;       // gerado pela bridge (uuid4) quando ela inicia
  string game_version = 2;     // opcional: hash/tag do fork do tmwa em uso
  string recorded_at = 3;      // ISO 8601 UTC, quando a bridge iniciou
  string bridge_host = 4;      // hostname/regiao da bridge -- util na Fase 11 (multi-regiao)
}

message TelemetryBatch {
  repeated PlayerEvent events = 1;
  int32 batch_sequence = 2;   // incremental dentro da sessao -- ajuda a detectar
                                // perda/duplicacao/fora-de-ordem na Fase 9
}

// primeira mensagem do stream = session_start; todas as seguintes = batch
message TelemetryStreamMessage {
  oneof payload {
    SessionInfo session_start = 1;
    TelemetryBatch batch = 2;
  }
}

message BatchAck {
  int32 batch_sequence = 1;
  int32 events_received = 2;
  bool ok = 3;
  string message = 4;
}

message SendBatchRequest {
  SessionInfo session = 1;
  TelemetryBatch batch = 2;
}

// ---------------------------------------------------------------------------
// Servico
// ---------------------------------------------------------------------------

service TelemetryService {
  rpc StreamTelemetry(stream TelemetryStreamMessage) returns (stream BatchAck);
  rpc SendBatch(SendBatchRequest) returns (BatchAck);
}
